services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glpi-desk
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

      # ── Banco de dados ──────────────────────────────────────
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      # ── Sessão (iron-session) ───────────────────────────────
      SESSION_SECRET: ${SESSION_SECRET}

      # ── SMTP (envio de OTP) ─────────────────────────────────
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
